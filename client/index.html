<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#f6fbfd" />
    <meta name="description" content="Neura — an adaptive learning dashboard, built for diverse minds." />
    <title>Neura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="preload" href="/fonts/opendyslexic-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      try {
        if (localStorage.getItem("neura_dyslexia_font") === "true") {
          document.documentElement.classList.add("dyslexia-font");
          if (document.body) {
            document.body.classList.add("dyslexia-font");
          } else {
            document.addEventListener("DOMContentLoaded", function() {
              if (localStorage.getItem("neura_dyslexia_font") === "true") {
                document.body.classList.add("dyslexia-font");
              }
            });
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
